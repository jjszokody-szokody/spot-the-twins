<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spot the Twins</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#1d2340;color:#fff;text-align:center}
h1{margin:12px 0 4px}#info{margin-bottom:10px;opacity:.85}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:10px;cursor:pointer;border:4px solid transparent;transition:transform .15s}
@media(hover:hover){.card:hover{transform:scale(1.03)}}.card.sel{border-color:#ffcc00}.card.bad{border-color:#ff4040;animation:shake .3s}
.card{touch-action:pan-y;user-select:none}.card.gone{visibility:hidden}.card svg{pointer-events:none;width:100%;display:block;border-radius:6px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fx{position:fixed;inset:0;pointer-events:none;display:none}
#msg{position:fixed;top:40%;width:100%;font-size:72px;font-weight:900;color:#fff;text-shadow:0 0 20px #f0f,0 0 40px #0ff;display:none}
@media(max-width:600px){#grid{grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}h1{font-size:22px}#info{font-size:13px}.card{border-width:3px;border-radius:6px}#msg{font-size:44px}}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hearts{font-size:26px;margin:10px 0 20px;letter-spacing:2px}
#over{position:fixed;inset:0;background:rgba(10,12,30,.92);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:700;z-index:5}
#final{font-size:96px;color:#ffcc00;margin:10px 0 24px}
#over button{font-size:24px;padding:12px 36px;background:#ffcc00;font-weight:700}
button{font-size:18px;padding:8px 18px;border-radius:8px;border:0;margin:6px;cursor:pointer}
</style></head><body>
<h1>Spot the Twins</h1><div id="info"></div><div id="grid"></div>
<div id="hearts"></div><div id="over"><div>Game Over</div><div id="final"></div><button onclick="retry()">Retry</button></div>
<canvas id="fx"></canvas><div id="msg">You Got It!</div>
<script>
let lives=10,level=1,score=0,sel=[],lock=false,misses=0;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)];
function base(){return{sky:R(180,230),sunX:R(40,90),sunR:R(14,22),sunHue:R(40,55),house:R(0,360),roof:R(0,360),door:R(0,360),doorX:R(-12,12),win:R(170,220),
treeH:R(50,75),tree:R(90,140),cloudX:R(110,190),clouds:RI(1,3),flowers:RI(2,5),bird:true,chimney:true,grass:R(85,125),rays:true,winCount:2}}
const keys={sky:'h',sunX:'n',sunR:'n',sunHue:'h',house:'h',roof:'h',door:'h',doorX:'n',win:'h',treeH:'n',tree:'h',cloudX:'n',grass:'h',
clouds:'c',flowers:'c',bird:'b',chimney:'b',rays:'b',winCount:'w'};
function vary(s,k,lv){const t=keys[k],f=Math.max(.12,1-(lv-1)*.11);s=Object.assign({},s);
 const sg=Math.random()<.5?-1:1;
 if(t=='h')s[k]=s[k]+sg*60*f; else if(t=='n')s[k]=s[k]+sg*Math.max(3,s[k]*.6*f+4*f);
 else if(t=='c')s[k]=s[k]+(s[k]>1?-1:1); else if(t=='b')s[k]=!s[k]; else s[k]=s[k]==2?1:2; return s}
function svg(s){const hsl=(h,sat=60,l=55)=>`hsl(${h},${sat}%,${l}%)`;let o=`<svg viewBox="0 0 240 180">`;
 o+=`<rect width="240" height="180" fill="${hsl(s.sky,70,78)}"/>`;
 if(s.rays)for(let i=0;i<8;i++){const a=i*Math.PI/4;o+=`<line x1="${s.sunX+Math.cos(a)*(s.sunR+3)}" y1="${35+Math.sin(a)*(s.sunR+3)}" x2="${s.sunX+Math.cos(a)*(s.sunR+10)}" y2="${35+Math.sin(a)*(s.sunR+10)}" stroke="${hsl(s.sunHue,90,55)}" stroke-width="2"/>`}
 o+=`<circle cx="${s.sunX}" cy="35" r="${s.sunR}" fill="${hsl(s.sunHue,90,58)}"/>`;
 for(let i=0;i<s.clouds;i++){const x=s.cloudX-i*45,y=28+i*12;o+=`<g fill="#fff"><ellipse cx="${x}" cy="${y}" rx="18" ry="8"/><ellipse cx="${x+10}" cy="${y-5}" rx="11" ry="8"/></g>`}
 if(s.bird)o+=`<path d="M190 55 q5 -5 10 0 q5 -5 10 0" stroke="#333" fill="none" stroke-width="1.5"/>`;
 o+=`<rect y="135" width="240" height="45" fill="${hsl(s.grass,50,45)}"/>`;
 if(s.chimney)o+=`<rect x="105" y="70" width="10" height="22" fill="#844"/>`;
 o+=`<rect x="60" y="95" width="80" height="45" fill="${hsl(s.house,55,62)}"/><polygon points="52,97 100,62 148,97" fill="${hsl(s.roof,50,40)}"/>`;
 o+=`<rect x="${92+s.doorX}" y="112" width="16" height="28" fill="${hsl(s.door,55,35)}"/>`;
 o+=`<rect x="67" y="104" width="14" height="12" fill="${hsl(s.win,70,75)}" stroke="#333"/>`;
 if(s.winCount==2)o+=`<rect x="119" y="104" width="14" height="12" fill="${hsl(s.win,70,75)}" stroke="#333"/>`;
 o+=`<rect x="183" y="${140-s.treeH*.35}" width="8" height="${s.treeH*.35}" fill="#6b4"/><rect x="183" y="${140-s.treeH*.35}" width="8" height="${s.treeH*.35}" fill="#6b4226"/><circle cx="187" cy="${140-s.treeH*.35-14}" r="${s.treeH*.3}" fill="${hsl(s.tree,55,38)}"/>`;
 for(let i=0;i<s.flowers;i++)o+=`<circle cx="${20+i*9}" cy="155" r="3" fill="hsl(${i*70},80%,60%)"/>`;
 return o+'</svg>'}
function newLevel(){sel=[];lock=false;misses=0;const b=base();
 let pool=Object.keys(keys);if(level>3)pool=pool.filter(k=>'hn'.includes(keys[k]));
 const cards=[];const used=new Set();
 while(cards.length<10){const k=pick(pool);const n=level>6?1:1;let v=vary(b,k,level);
  if(level>8){v=vary(v,pick(pool),level+3)}const sig=JSON.stringify(v);if(used.has(sig)||sig==JSON.stringify(b))continue;used.add(sig);cards.push({s:v,t:0})}
 cards.push({s:b,t:1},{s:b,t:1});cards.sort(()=>Math.random()-.5);
 const g=document.getElementById('grid');g.innerHTML='';
 cards.forEach(c=>{const d=document.createElement('div');d.className='card';d.innerHTML=svg(c.s);d.dataset.t=c.t;swipe(d);g.appendChild(d)});
 info()}
function hearts(){document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🤍'.repeat(10-lives)}
function retry(){lives=10;level=1;score=0;document.getElementById('over').style.display='none';newLevel()}
function swipe(d){let x0=null,y0=0,dx=0;
 d.onpointerdown=e=>{if(lock)return;x0=e.clientX;y0=e.clientY;dx=0;d.setPointerCapture(e.pointerId);d.style.transition='none'};
 d.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8){d.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;d.style.opacity=1-Math.min(.7,Math.abs(dx)/300)}};
 d.onpointerup=d.onpointercancel=e=>{if(x0===null)return;x0=null;d.style.transition='transform .25s,opacity .25s';
  if(Math.abs(dx)<10&&e.type=='pointerup'){d.style.transform='';d.style.opacity='';click(d);return}
  if(Math.abs(dx)>80&&!d.classList.contains('sel')){
   if(d.dataset.t=='1'){d.style.transform='';d.style.opacity='';d.classList.add('bad');misses++;lives--;hearts();setTimeout(()=>d.classList.remove('bad'),700);
    if(lives<=0){lock=true;document.getElementById('final').textContent=score;setTimeout(()=>document.getElementById('over').style.display='flex',600)}return}
   d.style.transform=`translateX(${dx>0?600:-600}px) rotate(${dx>0?30:-30}deg)`;d.style.opacity=0;setTimeout(()=>d.classList.add('gone'),250)}
  else{d.style.transform='';d.style.opacity=''}}}
function info(){hearts();document.getElementById('info').innerHTML=`Level ${level} &nbsp;•&nbsp; Score ${score} &nbsp;•&nbsp; Find the two identical pictures`}
function click(d){if(lock||d.classList.contains('sel'))return;d.classList.add('sel');sel.push(d);
 if(sel.length==2){lock=true;if(sel[0].dataset.t=='1'&&sel[1].dataset.t=='1'){score+=Math.max(10,100-misses*25)*level;info();fireworks()}
 else{misses++;lives--;hearts();if(lives<=0){document.getElementById('final').textContent=score;setTimeout(()=>document.getElementById('over').style.display='flex',600)}sel.forEach(x=>x.classList.add('bad'));setTimeout(()=>{sel.forEach(x=>x.classList.remove('sel','bad'));sel=[];lock=false},700)}}}
function fireworks(){const c=document.getElementById('fx'),m=document.getElementById('msg'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.display=m.style.display='block';
 let P=[],t=0;function burst(){const cx=R(100,c.width-100),cy=R(80,c.height/2),h=R(0,360);for(let i=0;i<80;i++){const a=R(0,6.28),v=R(1,6);P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(50,90),h})}}
 (function f(){x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,c.width,c.height);if(t%18==0&&t<150)burst();
  P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;x.fillStyle=`hsl(${p.h},100%,60%)`;x.fillRect(p.x,p.y,3,3)});
  if(++t<220)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.style.display=m.style.display='none';level++;newLevel()}})()}
newLevel();
</script></body></html>
